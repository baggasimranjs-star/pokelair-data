name: Update Limitless data
on:
  schedule:
    - cron: '17 10 * * *'   # daily, about 6:17 AM New York time, before PokéLair's 6:52 refresh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node update.mjs
        env:
          MAX_FETCH: ${{ github.event_name == 'workflow_dispatch' && '400' || '40' }}
      - name: Commit
        run: |
          git config user.name "pokelair-bot"
          git config user.email "pokelair-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Limitless data $(date -u +%F)"
          git push
